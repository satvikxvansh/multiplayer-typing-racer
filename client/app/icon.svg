<svg
  width="24"
  height="10"
  viewBox="-2 -2 24 10"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="3" cy="3" r="3" fill="#F2C14E" filter="url(#glow)" />
  <circle cx="10" cy="3" r="3" fill="#F2C14E" opacity="0.7" />
  <circle cx="17" cy="3" r="3" fill="#F2C14E" opacity="0.35" />
</svg>
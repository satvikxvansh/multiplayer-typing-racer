config:
  target: "https://multiplayer-typing-racer.onrender.com"
  engines:
    socketio-v3:
      transports: ["websocket"]
  payload:
    path: "./rooms.csv"
    fields: ["roomId"]
    order: random
    skipHeader: true
  phases:
    - { duration: 20, arrivalRate: 2,  name: "Warm up" }
    - { duration: 60, arrivalRate: 5,  name: "Sustained" }
    - { duration: 30, arrivalRate: 8,  name: "Step up" }
    - { duration: 30, arrivalRate: 12, name: "Peak" }

scenarios:
  - engine: socketio-v3
    flow:
      - emit: ["join_room", "{{ roomId }}"]
      - think: 1
      - emit: ["player_ready", "{{ roomId }}"]
      - think: 4
      - emit: ["typing_progress", { roomId: "{{ roomId }}", typedText: "The quick", timestamp: "{{ $timestamp }}" }]
      - think: 0.4
      - emit: ["typing_progress", { roomId: "{{ roomId }}", typedText: "The quick brown fox", timestamp: "{{ $timestamp }}" }]
      - think: 0.4
      - emit: ["typing_progress", { roomId: "{{ roomId }}", typedText: "The quick brown fox jumps over", timestamp: "{{ $timestamp }}" }]
      - think: 2